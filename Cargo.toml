[workspace]
members = [".", "crates/opticdrv-core"]
# Plain `cargo test`/`clippy` on any host only touches the portable crate; the
# driver itself needs the WDK and is built with `-p opticdrv` on Windows.
default-members = ["crates/opticdrv-core"]
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[package]
name = "opticdrv"
version = "0.1.0"
edition = "2024"
description = "Optic kernel driver (KMDF, Rust)"
license-file = "LICENSE"
publish = false

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
# 1.27 ships with Windows 10 1809, the oldest OS the Optic app supports. 1.33 needs
# Windows 11 22H2, so WdfVersionBind failed on older hosts (StartService error 87).
target-kmdf-version-minor = 27

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build = "0.6.0"

[dependencies]
wdk = "0.5.0"
wdk-alloc = "0.4.2"
wdk-panic = "0.5.0"
wdk-sys = "0.5.2"
opticdrv-core = { path = "crates/opticdrv-core" }

[profile.dev]
panic = "abort"

[profile.release]
lto = true
panic = "abort"

[lints]
workspace = true
