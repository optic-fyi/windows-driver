name: Release

# Builds, signs and publishes opticdrv.sys as a GitHub release. The monorepo's
# Windows app build downloads the latest release of this repo.
# Only runs from main, so branch protection on main decides what can be released.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    with:
      require_signature: true
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: opticdrv
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          (cd dist && sha256sum opticdrv.sys > opticdrv.sys.sha256)
          hash=$(cut -d' ' -f1 dist/opticdrv.sys.sha256)
          # The monorepo finds its pinned release by this 12 hex suffix, then checks the full hash.
          tag="v${version}-${hash::12}"
          cat > notes.md <<EOF
          ## Pin this driver in the monorepo

          SHA-256 of \`opticdrv.sys\` (built from ${GITHUB_SHA}):

          \`\`\`
          ${hash}
          \`\`\`

          To make the Windows app build use this release:

          \`\`\`
          gh secret set OPTIC_DRIVER_SHA256 --repo optic-fyi/monorepo --body ${hash}
          \`\`\`

          Signed with the Optic test certificate (public part: \`optic-driver-test.cer\`).

          EOF
          gh release create "$tag" dist/opticdrv.sys dist/opticdrv.sys.sha256 dist/optic-driver-test.cer \
            --target "$GITHUB_SHA" \
            --title "opticdrv $tag" \
            --notes-file notes.md \
            --generate-notes
