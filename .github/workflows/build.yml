name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Used by release.yml, which must never publish an unsigned driver.
  workflow_call:
    inputs:
      require_signature:
        type: boolean
        default: false

jobs:
  # Job names are the required status checks of the `main` ruleset: renaming one
  # means updating the ruleset.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Everything that does not need the WDK: lints and tests of opticdrv-core.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  driver:
    runs-on: windows-2025
    env:
      TARGET: x86_64-pc-windows-msvc
      WDK_VERSION: 10.0.26100
    steps:
      - uses: actions/checkout@v7

      # wdk-build uses the NEWEST Windows Kit under Include\, and the runner image already
      # ships SDK 10.0.26100 without the WDK, so the WDK must be 26100 too (22621 was ignored).
      - name: Install WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $crt = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$env:WDK_VERSION.0\km\crt"
          if (-not (Test-Path $crt)) {
            winget install --id "Microsoft.WindowsWDK.$env:WDK_VERSION" --exact --silent --accept-package-agreements --accept-source-agreements
          }
          if (-not (Test-Path $crt)) { throw "WDK $env:WDK_VERSION not installed: $crt is missing" }
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" | Select-Object -ExpandProperty Name
          clang --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      # Caches ~/.cargo and target/ (including the slow wdk-sys bindgen output).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}-wdk-${{ env.WDK_VERSION }}

      - name: Clippy
        run: cargo clippy -p opticdrv --locked --target ${{ env.TARGET }}

      - name: Build
        run: cargo build -p opticdrv --release --locked --target ${{ env.TARGET }}

      - name: Stage opticdrv.sys
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$env:TARGET/release/opticdrv.dll" dist/opticdrv.sys
          Copy-Item optic-driver-test.cer dist/

      # Same certificate every run: it comes from the repo secrets, never generated here.
      # Fork PRs have no secrets, so they get an unsigned driver.
      - name: Sign opticdrv.sys
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.DRIVER_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.DRIVER_SIGNING_PFX_PASSWORD }}
          REQUIRE_SIGNATURE: ${{ inputs.require_signature }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PFX_BASE64 -and $env:REQUIRE_SIGNATURE -eq 'true') { throw 'Signing secrets are missing; refusing to produce an unsigned release.' }
          if (-not $env:PFX_BASE64) { Write-Warning 'No signing secrets; leaving driver unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'optic-driver-test.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist/opticdrv.sys
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
          Remove-Item $pfx
          $sig = Get-AuthenticodeSignature dist/opticdrv.sys
          $expected = (New-Object Security.Cryptography.X509Certificates.X509Certificate2 (Resolve-Path optic-driver-test.cer)).Thumbprint
          if ($sig.SignerCertificate.Thumbprint -ne $expected) { throw "Signed with unexpected certificate $($sig.SignerCertificate.Thumbprint)" }

      - uses: actions/upload-artifact@v7
        with:
          name: opticdrv
          path: dist/
